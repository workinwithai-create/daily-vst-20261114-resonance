name: Build and Release November Resonance

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package artefacts
        shell: bash
        run: |
          mkdir -p package
          if [ "${{ runner.os }}" = "macOS" ]; then
            find build -name "*.vst3" -type d -exec cp -R {} package/ \;
            find build -name "*.app" -type d -exec cp -R {} package/ \;
            cd package && zip -r ../NovemberResonance-macOS.zip . && cd ..
          else
            find build -name "*.vst3" -type d -exec cp -R {} package/ \;
            find build -name "*.exe" -exec cp {} package/ \;
            cd package && zip -r ../NovemberResonance-Windows.zip . && cd ..
          fi

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: NovemberResonance-*.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'

    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: November Resonance Build ${{ github.run_number }}
          body: |
            Automated Release build of November Resonance.
            Includes VST3 and Standalone for macOS and Windows.
          files: artefacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
